version: 2

updates:
  - package-ecosystem: 'npm'
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      devDependencies:
        dependency-type: development
        patterns:
          - '*'
      dependencies:
        dependency-type: production
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
